<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'self'">
  <title>API Gateway 管理登录</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0d1117; color: #c9d1d9; }
    .card { width: min(420px, 100%); padding: 28px; border: 1px solid #30363d; border-radius: 14px; background: #161b22; box-shadow: 0 18px 50px rgba(0,0,0,.35); }
    h1 { margin: 0 0 8px; color: #f0f6fc; font-size: 24px; }
    p { margin: 0 0 22px; color: #8b949e; line-height: 1.55; }
    label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
    input { width: 100%; padding: 12px 13px; border: 1px solid #30363d; border-radius: 8px; outline: none; background: #0d1117; color: #f0f6fc; font: inherit; }
    input:focus { border-color: #58a6ff; box-shadow: 0 0 0 3px rgba(88,166,255,.15); }
    button { width: 100%; margin-top: 14px; padding: 12px; border: 0; border-radius: 8px; background: #238636; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #2ea043; }
    button:disabled { opacity: .65; cursor: wait; }
    .error { min-height: 22px; margin-top: 12px; color: #ff7b72; font-size: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>API Gateway 管理登录</h1>
    <p>请输入独立的管理 Key。它只用于管理后台，不能调用模型 API。</p>
    <form id="loginForm">
      <label for="adminKey">管理 Key</label>
      <input id="adminKey" name="admin_key" type="password" required autocomplete="current-password" autofocus>
      <button id="submitButton" type="submit">登录</button>
      <div class="error" id="errorMessage" role="alert"></div>
    </form>
  </main>
  <script>
    const form = document.getElementById('loginForm');
    const input = document.getElementById('adminKey');
    const button = document.getElementById('submitButton');
    const errorMessage = document.getElementById('errorMessage');

    form.addEventListener('submit', async event => {
      event.preventDefault();
      errorMessage.textContent = '';
      button.disabled = true;
      button.textContent = '验证中...';
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ admin_key: input.value.trim() }),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          if (response.status === 429) throw new Error('尝试次数过多，请稍后再试');
          throw new Error(data.error?.message === 'Invalid management key' ? '管理 Key 不正确' : (data.error?.message || `HTTP ${response.status}`));
        }
        input.value = '';
        location.replace('/');
      } catch (error) {
        errorMessage.textContent = error.message || '登录失败';
        input.select();
      } finally {
        button.disabled = false;
        button.textContent = '登录';
      }
    });
  </script>
</body>
</html>
